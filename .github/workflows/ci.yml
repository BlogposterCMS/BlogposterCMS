name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install and verify Linux community isolation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap util-linux apparmor-profiles
          # Ubuntu restricts user namespaces even when bwrap is installed. Its
          # packaged profile grants setup access and strips child capabilities.
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo useradd --system --create-home --user-group blogposter-sandbox-test
          # Export tracked files only: never expose checkout credentials in .git.
          sudo install -d -o blogposter-sandbox-test -g blogposter-sandbox-test /tmp/blogposter-sandbox-tests
          git archive HEAD | sudo -u blogposter-sandbox-test tar -x -C /tmp/blogposter-sandbox-tests
          sudo cp -a node_modules /tmp/blogposter-sandbox-tests/node_modules
          sudo chown -R blogposter-sandbox-test:blogposter-sandbox-test /tmp/blogposter-sandbox-tests/node_modules
          cd /tmp/blogposter-sandbox-tests
          sudo -u blogposter-sandbox-test "$(command -v node)" tools/verify-community-sandbox.js
      - name: Run real Linux sandbox integration tests
        # RLIMIT_NPROC is UID-wide. Keep runner services out of the test budget,
        # matching the dedicated unprivileged application user in production.
        run: |
          printf 'Runner UID task count: '; ps -u "$(id -u)" -L --no-headers | wc -l
          cd /tmp/blogposter-sandbox-tests
          sudo -u blogposter-sandbox-test "$(command -v node)" node_modules/jest/bin/jest.js --runInBand tests/moduleProcessRuntime.test.js tests/moduleRegistryEventsActivation.test.js
      - name: Run vulnerability audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Verify placeholder parity
        run: npm run placeholder-parity
      - name: Run test suite
        # RLIMIT_NPROC counts threads across the runner UID, including Jest workers.
        run: npm test -- --runInBand --testPathIgnorePatterns 'tests/(moduleProcessRuntime|moduleRegistryEventsActivation)\.test\.js$'

  codeql_analysis:
    needs: lint_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  container:
    needs: lint_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Unsigned branch builds are diagnostic only; release CI verifies the
      # signed final image, including its configured non-root user, offline.
      - name: Build non-deployable native dependency stage
        run: docker build --pull --target build --tag blogposter-cms:ci .
      - name: Verify non-root native runtime
        run: >-
          docker run --rm --network none --user node --entrypoint node blogposter-cms:ci -e
          "if(process.getuid()===0)throw new Error('CONTAINER_ROOT_USER');
          require('sqlite3').verbose();require('bcrypt');require('express');
          console.log('CONTAINER_NATIVE_RUNTIME_OK')"
