name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  packages: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches package version
        run: |
          test "${GITHUB_REF_TYPE}" = "tag" || { echo "CORE_UPDATE_RELEASE_TAG_REQUIRED"; exit 1; }
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}" || { echo "CORE_UPDATE_RELEASE_TAG_MISMATCH"; exit 1; }
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vulnerability audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Verify placeholder parity
        run: npm run placeholder-parity
      - name: Run test suite
        run: npm test
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      - name: Keep only production dependencies for the signed runtime baseline
        run: npm prune --omit=dev
      - name: Create signed runtime integrity baseline
        run: node tools/create-runtime-integrity-manifest.js runtime-integrity-manifest.json
      - name: Attest runtime integrity baseline
        id: runtime_integrity_attestation
        uses: actions/attest@v4
        with:
          subject-path: runtime-integrity-manifest.json
      - name: Stage runtime integrity attestation bundle
        run: cp "${{ steps.runtime_integrity_attestation.outputs.bundle-path }}" runtime-integrity-manifest.bundle.json
      - name: Export TUF-verified public trust roots for offline startup
        run: gh attestation trusted-root > runtime-integrity-trusted-root.jsonl
      - name: Zip Build Artifacts
        run: zip -r blogposter_cms_build.zip public/build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blogposter_cms_build
          path: |
            blogposter_cms_build.zip
            runtime-integrity-manifest.json
            runtime-integrity-manifest.bundle.json
            runtime-integrity-trusted-root.jsonl

  publish_image:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.repository }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download signed runtime integrity assets
        uses: actions/download-artifact@v4
        with:
          name: blogposter_cms_build
          path: .release-integrity
      - name: Resolve immutable release identity
        id: image
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/blogpostercms/blogpostercms" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish reviewed server image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
      - name: Attest server image build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify signed final runtime with no network or credentials
        env:
          RELEASE_IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$RELEASE_IMAGE"
          docker run --rm --network none --entrypoint node "$RELEASE_IMAGE" -e \
            "if(process.getuid()===0)throw new Error('CONTAINER_ROOT_USER');
            require('./mother/security/runtimeIntegrity').verifyRuntimeIntegrity({rootDir:'/app'})
            .then(()=>{require('sqlite3').verbose();require('bcrypt');require('express');
            console.log('CONTAINER_OFFLINE_INTEGRITY_OK')})
            .catch(e=>{console.error(e.code||'CONTAINER_INTEGRITY_FAILED');process.exit(1)})"
      - name: Create updater release manifest
        env:
          BLOGPOSTER_IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          BLOGPOSTER_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-assets
          node tools/create-core-update-manifest.js release-assets/blogposter-update.json
          cp deploy/blogposter-update release-assets/blogposter-update
          cp deploy/blogposter-updater.conf.example release-assets/blogposter-updater.conf.example
          cp deploy/blogposter.compose.yml release-assets/blogposter.compose.yml
          cp deploy/deployment.env.example release-assets/deployment.env.example
          chmod 0755 release-assets/blogposter-update
      - name: Attest updater release manifest
        id: updater_manifest_attestation
        uses: actions/attest@v4
        with:
          subject-path: release-assets/blogposter-update.json
      - name: Stage updater manifest attestation bundle
        run: cp "${{ steps.updater_manifest_attestation.outputs.bundle-path }}" release-assets/blogposter-update.bundle.json
      - name: Upload core updater assets
        uses: actions/upload-artifact@v4
        with:
          name: blogposter_core_release
          path: release-assets/

  release:
    needs: [validate, publish_image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: blogposter_cms_build
          path: ./release-assets
      - name: Download core updater assets
        uses: actions/download-artifact@v4
        with:
          name: blogposter_core_release
          path: ./release-assets

      - name: Create transport checksums for every release asset
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Read CHANGELOG.md
        id: changelog
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_NOTES=$(awk -v heading="## [${RELEASE_VERSION}]" '$0 == heading || index($0, heading " - ") == 1 {flag=1; next} /^## / {if(flag) exit} flag' CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          body: ${{ env.notes }}
          artifacts: "./release-assets/*"
