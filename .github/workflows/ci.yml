name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vulnerability audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Verify placeholder parity
        run: npm run placeholder-parity
      - name: Run test suite
        run: npm test

  codeql_analysis:
    needs: lint_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  container:
    needs: lint_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build independent server image
        run: docker build --pull --tag blogposter-cms:ci .
      - name: Verify non-root native runtime
        run: >-
          docker run --rm --entrypoint node blogposter-cms:ci -e
          "if(process.getuid()===0)throw new Error('CONTAINER_ROOT_USER');
          require('sqlite3').verbose();require('bcrypt');require('express');
          console.log('CONTAINER_NATIVE_RUNTIME_OK')"
