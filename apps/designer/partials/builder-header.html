<header id="builder-header" class="builder-header">
  <div class="builder-header-brand">
    <button class="builder-back-btn" type="button" aria-label="Back" title="Back">
      <img src="/assets/icons/arrow-left.svg" alt="" class="icon" />
    </button>
    <label class="layout-name-shell">
      <span class="layout-name-label">Studio</span>
      <input
        id="layoutNameInput"
        type="text"
        class="layout-name-input"
        placeholder="Scene builder"
        required
      />
      <img src="/assets/icons/chevron-down.svg" alt="" class="icon layout-name-chevron" />
    </label>
  </div>

  <div class="header-actions">
    <button class="button header-icon-btn menu-undo" type="button" aria-label="Undo" title="Undo">
      <img src="/assets/icons/undo-2.svg" class="icon" alt="" />
    </button>
    <button class="button header-icon-btn menu-redo" type="button" aria-label="Redo" title="Redo">
      <img src="/assets/icons/redo-2.svg" class="icon" alt="" />
    </button>
    <button id="previewLayoutBtn" class="button header-icon-btn builder-preview-btn" type="button" aria-label="Preview" title="Preview">
      <img src="/assets/icons/play.svg" class="icon" alt="" />
    </button>
    <button id="globalDesignSettingsBtn" class="button header-icon-btn builder-design-settings-btn" type="button" aria-label="Design settings" title="Design settings">
      <img src="/assets/icons/settings.svg" class="icon" alt="" />
    </button>
    <button id="viewportControlBtn" class="button header-icon-btn builder-viewport-btn" type="button" aria-label="Viewport" title="Viewport">
      <img src="/assets/icons/monitor.svg" class="icon" alt="" />
    </button>
    <button id="saveLayoutBtn" class="button header-icon-btn builder-save-btn" type="button" aria-label="Save" title="Save">
      <img src="/assets/icons/save.svg" class="icon" alt="" />
    </button>
    <button id="publishLayoutBtn" class="button builder-publish-btn" type="button" aria-label="Open publishing" title="Open publishing">
      Publish
    </button>
    <button class="button header-icon-btn builder-menu-btn" type="button" aria-label="More actions" title="More actions">
      <img src="/assets/icons/ellipsis.svg" class="icon" alt="" />
    </button>
  </div>
  <div class="viewport-slider">
    <div class="viewport-control-heading">
      <span>Viewport</span>
      <strong class="viewport-value"></strong>
    </div>
    <div class="scene-device-switcher builder-header-viewport-presets" role="group" aria-label="Viewport presets">
      <button type="button" class="active" data-builder-viewport-preset="desktop" aria-label="Desktop" aria-pressed="true"><img src="/assets/icons/monitor.svg" alt="" class="icon" /></button>
      <button type="button" data-builder-viewport-preset="tablet" aria-label="Tablet" aria-pressed="false"><img src="/assets/icons/tablet.svg" alt="" class="icon" /></button>
      <button type="button" data-builder-viewport-preset="mobile" aria-label="Mobile" aria-pressed="false"><img src="/assets/icons/smartphone.svg" alt="" class="icon" /></button>
    </div>
    <div class="viewport-width-band">
      <input type="range" class="viewport-range" min="320" max="3840" step="10" aria-label="Builder viewport width" />
      <div class="responsive-rule-markers" aria-hidden="true"></div>
    </div>
    <div class="responsive-validity">
      <div class="responsive-validity-heading">
        <span>Selected change applies</span>
        <output class="responsive-validity-value">1025–3840px</output>
      </div>
      <div class="responsive-validity-band" style="--responsive-range-start: 20%; --responsive-range-end: 100%;">
        <span class="responsive-validity-track" aria-hidden="true"></span>
        <span class="responsive-validity-active" aria-hidden="true"></span>
        <input type="range" class="responsive-range-min" min="320" max="3840" step="1" value="1025" aria-label="Responsive range start" />
        <input type="range" class="responsive-range-max" min="320" max="3840" step="1" value="3840" aria-label="Responsive range end" />
      </div>
      <div class="responsive-validity-actions" role="group" aria-label="Responsive range shortcuts">
        <button type="button" data-responsive-scope="lower">Up to here</button>
        <button type="button" data-responsive-scope="range">Range</button>
        <button type="button" data-responsive-scope="higher">From here</button>
        <button type="button" data-responsive-scope="all">All</button>
      </div>
    </div>
  </div>
  <div class="builder-options-menu">
    <label class="menu-pro"><input type="checkbox" class="pro-toggle" checked /> Pro Mode</label>
  </div>
</header>
